services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: applymate
      POSTGRES_USER: applymate
      POSTGRES_PASSWORD: applymate
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
    depends_on:
      - postgres
      - redis
    environment:
      DATABASE_URL: postgresql+psycopg://applymate:applymate@postgres:5432/applymate
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      APP_ENV: ${APP_ENV:-development}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      BROWSER_HEADLESS: ${BROWSER_HEADLESS:-true}
      MAX_RETRIES: ${MAX_RETRIES:-3}
      JOB_CHECK_INTERVAL_SECONDS: ${JOB_CHECK_INTERVAL_SECONDS:-300}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./backend/storage:/app/storage
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      target: development
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api
    ports:
      - "5173:5173"
    command: npm run dev -- --host 0.0.0.0

  worker:
    profiles:
      - legacy
    build:
      context: ./backend
    depends_on:
      - postgres
      - redis
    environment:
      DATABASE_URL: postgresql+psycopg://applymate:applymate@postgres:5432/applymate
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
    command: python -m app.workers.scheduler

  browser-worker:
    profiles:
      - legacy
    build:
      context: ./backend
    depends_on:
      - postgres
      - redis
    environment:
      DATABASE_URL: postgresql+psycopg://applymate:applymate@postgres:5432/applymate
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      BROWSER_HEADLESS: ${BROWSER_HEADLESS:-true}
    command: python -m app.workers.browser

volumes:
  postgres_data:
